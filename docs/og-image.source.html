<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;
background:linear-gradient(135deg,#0057FF 0%,#0038B8 55%,#00258A 100%);position:relative;color:#fff}
.glow{position:absolute;right:-120px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(120,170,255,.35),transparent 65%)}
.left{position:absolute;left:60px;top:60px;width:640px;height:510px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:800;letter-spacing:-.02em}
h1{font-size:64px;white-space:nowrap;line-height:1.06;font-weight:800;letter-spacing:-.035em}
.sub{margin-top:26px;font-size:28px;line-height:1.35;color:rgba(255,255,255,.8);font-weight:500}
.url{position:absolute;right:60px;bottom:48px;font-size:28px;font-weight:600;color:rgba(255,255,255,.85)}
.card{position:absolute;left:690px;top:70px;width:440px;height:396px;background:#fff;border-radius:24px;color:#111827;
padding:24px;transform:perspective(1600px) rotateY(-9deg) rotateZ(2deg);box-shadow:0 40px 80px rgba(0,20,90,.5),0 8px 20px rgba(0,20,90,.3)}
.lab{font-size:20px;color:#6B7280;font-weight:600}
.nw{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.pill{display:inline-block;margin-left:10px;font-size:22px;font-weight:700;color:#047857;background:#D1FAE5;border-radius:999px;padding:4px 14px;vertical-align:middle}
.row{display:flex;align-items:center;justify-content:space-between;font-size:22px;padding:8px 0;border-top:1px solid #E5E7EB}
.row b{font-weight:700}.dot{width:14px;height:14px;border-radius:7px;display:inline-block;margin-right:12px}
</style></head><body><div class="glow"></div>
